<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="cp-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00C4B4"/>
      <stop offset="50%" stop-color="#0091DA"/>
      <stop offset="100%" stop-color="#005A9C"/>
    </linearGradient>
    <linearGradient id="cp-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7A00"/>
      <stop offset="100%" stop-color="#FF4800"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="28" fill="#0E1626"/>
  <!-- Outer radar ring -->
  <circle cx="64" cy="64" r="44" fill="none" stroke="url(#cp-grad)" stroke-width="4.5" stroke-dasharray="8 6" opacity="0.65"/>
  <!-- Mid radar ring -->
  <circle cx="64" cy="64" r="32" fill="none" stroke="url(#cp-grad)" stroke-width="5" opacity="0.85"/>
  <!-- Inner target ring -->
  <circle cx="64" cy="64" r="18" fill="none" stroke="#00C4B4" stroke-width="4.5"/>
  <!-- Central pulse node -->
  <circle cx="64" cy="64" r="8" fill="url(#cp-accent)"/>
  <!-- Signal radar sweep indicators -->
  <path d="M64 12 L64 24 M64 104 L64 116 M12 64 L24 64 M104 64 L116 64" stroke="#00C4B4" stroke-width="4" stroke-linecap="round"/>
  <!-- Catchpoint node pulse point -->
  <circle cx="88" cy="40" r="5" fill="#FF7A00"/>
  <path d="M64 64 L88 40" stroke="#FF7A00" stroke-width="2.5" stroke-dasharray="3 3" opacity="0.85"/>
</svg>
